services:
  agent:
    image: 1c04c93247fc
    ports:
      - "${HOST_PORT:-8080}:${CONTAINER_PORT:-8080}"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - MODEL_NAME=${MODEL_NAME}
      - PORT=${CONTAINER_PORT:-8080}
    restart: unless-stopped