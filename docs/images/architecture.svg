<svg viewBox="0 0 1100 750">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee" />
          </marker>
          <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
          </marker>
          <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa" />
          </marker>
          <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c" />
          </marker>
          <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background -->
        <rect width="1100" height="750" fill="url(#grid)" />

        <!-- ===== Region: Docker Container ===== -->
        <rect x="30" y="25" width="1040" height="700" rx="12" fill="rgba(251, 191, 36, 0.03)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="42" y="43" fill="#fbbf24" font-size="10" font-weight="600">Docker Container (BE:8080)</text>

        <!-- ================================================================
             LAYER 1: 前端层
             ================================================================ -->
        <!-- External: User -->
        <rect x="80" y="140" width="120" height="50" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="140" y="162" fill="white" font-size="11" font-weight="600" text-anchor="middle">👤 用户</text>
        <text x="140" y="178" fill="#94a3b8" font-size="9" text-anchor="middle">浏览器/HTTPS</text>

        <!-- Frontend -->
        <rect x="80" y="270" width="200" height="100" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
        <text x="180" y="298" fill="#22d3ee" font-size="12" font-weight="700" text-anchor="middle">Frontend</text>
        <text x="180" y="318" fill="white" font-size="10" text-anchor="middle">React 19 + TypeScript</text>
        <text x="180" y="334" fill="#94a3b8" font-size="9" text-anchor="middle">Vite · SSE Streaming</text>
        <text x="180" y="352" fill="#64748b" font-size="8" text-anchor="middle">SPA 聊天应用 (localStorage)</text>

        <!-- ================================================================
             LAYER 2: API 网关层
             ================================================================ -->
        <!-- User → FE -->
        <line x1="140" y1="190" x2="140" y2="268" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
        <text x="160" y="230" fill="#94a3b8" font-size="8">交互</text>

        <!-- FE → BE -->
        <line x1="280" y1="310" x2="368" y2="310" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
        <text x="324" y="303" fill="#94a3b8" font-size="8">REST/SSE</text>

        <!-- FastAPI -->
        <rect x="370" y="100" width="160" height="140" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="380" y="115" fill="#fbbf24" font-size="8">FastAPI Gateway</text>

        <rect x="385" y="125" width="130" height="45" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="450" y="142" fill="white" font-size="10" font-weight="600" text-anchor="middle">POST /auth</text>
        <text x="450" y="158" fill="#94a3b8" font-size="8" text-anchor="middle">API Key 验证</text>

        <rect x="385" y="180" width="130" height="45" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="450" y="197" fill="white" font-size="10" font-weight="600" text-anchor="middle">POST /chat</text>
        <text x="450" y="213" fill="#94a3b8" font-size="8" text-anchor="middle">SSE 流式响应</text>

        <!-- ================================================================
             LAYER 3: 核心 Agent 层
             ================================================================ -->
        <rect x="560" y="55" width="240" height="220" rx="8" fill="rgba(6, 78, 59, 0.08)" stroke="#34d399" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="572" y="72" fill="#34d399" font-size="8">AgentScope Core</text>

        <!-- Session Manager -->
        <rect x="575" y="80" width="210" height="40" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="680" y="96" fill="white" font-size="10" font-weight="600" text-anchor="middle">SessionManager</text>
        <text x="680" y="111" fill="#94a3b8" font-size="8" text-anchor="middle">24h 过期 · 每小时清理</text>

        <!-- MetatoolReActAgent -->
        <rect x="575" y="130" width="210" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="680" y="150" fill="white" font-size="10" font-weight="600" text-anchor="middle">MetatoolReActAgent</text>
        <text x="680" y="166" fill="#94a3b8" font-size="8" text-anchor="middle">Role: Webassistance (总调度)</text>
        <text x="680" y="180" fill="#94a3b8" font-size="8" text-anchor="middle">ReAct: 思考 ⇄ 行动 ⇄ 观察</text>

        <!-- Persona / Prompt -->
        <rect x="575" y="200" width="210" height="65" rx="6" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="1"/>
        <text x="680" y="218" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">Persona 提示词</text>
        <text x="680" y="233" fill="#64748b" font-size="7" text-anchor="middle">PROFILE · SOUL · AGENTS</text>
        <text x="680" y="248" fill="#64748b" font-size="7" text-anchor="middle">MEMORY · BOOTSTRAP</text>

        <!-- ================================================================
             LAYER 4: Tools &amp; Skills 层
             ================================================================ -->
        <!-- Toolkit Box -->
        <rect x="160" y="440" width="640" height="270" rx="8" fill="rgba(161, 120, 42, 0.05)" stroke="#fb923c" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="172" y="458" fill="#fb923c" font-size="9" font-weight="600">Toolkit &amp; Skills</text>

        <!-- Sub-Agent Tools Group -->
        <rect x="180" y="472" width="290" height="110" rx="6" fill="rgba(120, 53, 15, 0.15)" stroke="#fb923c" stroke-width="1"/>
        <text x="192" y="488" fill="#fb923c" font-size="8">子 Agent 工具 (短生命周期)</text>

        <!-- Sales Agent -->
        <rect x="195" y="498" width="125" height="36" rx="5" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="257" y="513" fill="white" font-size="9" font-weight="600" text-anchor="middle">sales_agent_tool</text>
        <text x="257" y="527" fill="#94a3b8" font-size="7" text-anchor="middle">产品推荐·报价·库存</text>

        <!-- Technical Agent -->
        <rect x="195" y="540" width="125" height="36" rx="5" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="257" y="555" fill="white" font-size="9" font-weight="600" text-anchor="middle">technical_agent_tool</text>
        <text x="257" y="569" fill="#94a3b8" font-size="7" text-anchor="middle">失效分析·热处理·材质</text>

        <!-- Production Agent -->
        <rect x="330" y="498" width="125" height="78" rx="5" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="392" y="515" fill="white" font-size="9" font-weight="600" text-anchor="middle">production</text>
        <text x="392" y="530" fill="white" font-size="9" font-weight="600" text-anchor="middle">_agent_tool</text>
        <text x="392" y="550" fill="#94a3b8" font-size="7" text-anchor="middle">工艺·质检·交期</text>
        <text x="392" y="566" fill="#64748b" font-size="6" text-anchor="middle">各含 web-search + memory</text>

        <!-- Agent Skills -->
        <rect x="490" y="472" width="150" height="110" rx="6" fill="rgba(76, 29, 149, 0.15)" stroke="#a78bfa" stroke-width="1"/>
        <text x="502" y="488" fill="#a78bfa" font-size="8">Agent Skills</text>
        <text x="565" y="505" fill="white" font-size="8" text-anchor="middle">📋 智能分析</text>
        <text x="565" y="520" fill="white" font-size="8" text-anchor="middle">🧠 长期记忆</text>
        <text x="565" y="535" fill="white" font-size="8" text-anchor="middle">🧭 产品导航</text>

        <!-- Browser Tool -->
        <rect x="660" y="472" width="125" height="55" rx="6" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="722" y="492" fill="white" font-size="9" font-weight="600" text-anchor="middle">agent_browser</text>
        <text x="722" y="508" fill="#94a3b8" font-size="8" text-anchor="middle">官网页面导航</text>
        <text x="722" y="520" fill="#64748b" font-size="7" text-anchor="middle">URL → 内容提取</text>

        <!-- MCP Client -->
        <rect x="660" y="542" width="125" height="55" rx="6" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1.5"/>
        <text x="722" y="562" fill="white" font-size="9" font-weight="600" text-anchor="middle">web-search MCP</text>
        <text x="722" y="578" fill="#94a3b8" font-size="8" text-anchor="middle">Streamable HTTP</text>
        <text x="722" y="590" fill="#64748b" font-size="7" text-anchor="middle">多引擎搜索</text>

        <!-- ================================================================
             LAYER 5: 外部服务
             ================================================================ -->
        <!-- DeepSeek API -->
        <rect x="830" y="80" width="180" height="55" rx="8" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="2"/>
        <text x="920" y="100" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">🧠 DeepSeek API</text>
        <text x="920" y="118" fill="#94a3b8" font-size="9" text-anchor="middle">deepseek-chat (OpenAI 兼容)</text>
        <text x="920" y="130" fill="#64748b" font-size="7" text-anchor="middle">LLM 推理引擎</text>

        <!-- MCP Server -->
        <rect x="830" y="170" width="180" height="55" rx="8" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1.5"/>
        <text x="920" y="190" fill="#fb923c" font-size="10" font-weight="600" text-anchor="middle">🌐 Web-Search MCP</text>
        <text x="920" y="206" fill="#94a3b8" font-size="8" text-anchor="middle">47.94.179.114:3000</text>
        <text x="920" y="218" fill="#64748b" font-size="7" text-anchor="middle">百度·必应·DuckDuckGo</text>

        <!-- ================================================================
             ARROWS
             ================================================================ -->
        <!-- BE → Agent (Session → Agent) -->
        <line x1="515" y1="195" x2="573" y2="165" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
        <text x="530" y="172" fill="#34d399" font-size="7">create</text>

        <!-- Agent → Toolkit -->
        <line x1="680" y1="190" x2="680" y2="438" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
        <text x="692" y="320" fill="#94a3b8" font-size="7">tool_call</text>

        <!-- Agent → DeepSeek -->
        <line x1="785" y1="130" x2="828" y2="105" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
        <text x="795" y="112" fill="#94a3b8" font-size="7">API</text>

        <!-- Sub-agents → MCP -->
        <line x1="455" y1="555" x2="658" y2="570" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
        <text x="520" y="548" fill="#94a3b8" font-size="7">search</text>

        <!-- Sub-agents → DeepSeek -->
        <path d="M 455 510 L 810 510 Q 820 510 820 120 Q 820 115 828 115" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-violet)"/>
        <text x="830" y="310" fill="#94a3b8" font-size="7">LLM call (短生命周期)</text>

        <!-- ================================================================
             LEGEND
             ================================================================ -->
        <text x="830" y="280" fill="white" font-size="10" font-weight="700">图例</text>
        
        <rect x="830" y="292" width="14" height="8" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
        <text x="850" y="300" fill="#94a3b8" font-size="7">前端</text>

        <rect x="900" y="292" width="14" height="8" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
        <text x="920" y="300" fill="#94a3b8" font-size="7">后端/Agent</text>

        <rect x="830" y="308" width="14" height="8" rx="2" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
        <text x="850" y="316" fill="#94a3b8" font-size="7">子 Agent</text>

        <rect x="900" y="308" width="14" height="8" rx="2" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="1"/>
        <text x="920" y="316" fill="#94a3b8" font-size="7">LLM API</text>

        <rect x="830" y="324" width="14" height="8" rx="2" fill="rgba(251, 146, 60, 0.15)" stroke="#fb923c" stroke-width="1"/>
        <text x="850" y="332" fill="#94a3b8" font-size="7">MCP 工具</text>

        <rect x="900" y="324" width="14" height="8" rx="2" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
        <text x="920" y="332" fill="#94a3b8" font-size="7">安全/认证</text>

        <rect x="830" y="340" width="14" height="8" rx="2" fill="transparent" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="850" y="348" fill="#94a3b8" font-size="7">边界/区域</text>

        <line x1="830" y1="362" x2="844" y2="362" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="850" y="365" fill="#94a3b8" font-size="7">虚线流</text>
      </svg>